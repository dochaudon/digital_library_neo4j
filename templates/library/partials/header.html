<header class="site-header">
    <div class="container header-inner">

        <!-- LEFT: Logo -->
        <a href="{{ url_for('main.home') }}" class="brand">
            <span class="brand-icon">📚</span>
            <span class="brand-text">Thư Viện Số</span>
        </a>

        <!-- RIGHT -->
        <div class="header-right">

            {% if session.get("user") %}
                <div class="user-menu-container">
                    <div class="user-dropdown">
                        <button class="dropdown-btn">
                            👤 {{ session.get("user")["username"] }}
                            <i class="fas fa-chevron-down" style="font-size: 10px; margin-left: 5px;"></i>
                        </button>
                        <div class="dropdown-content">
                            {% if session.get("user")["role"] == "admin" %}
                                <a href="/admin/documents">
                                    <i class="fas fa-cog"></i> Quản trị hệ thống
                                </a>
                            {% endif %}
                            <a href="/profile">
                                <i class="fas fa-user-circle"></i> Trang cá nhân
                            </a>
                            <div class="dropdown-divider"></div>
                            <a href="{{ url_for('auth.logout') }}" class="logout-item">
                                <i class="fas fa-sign-out-alt"></i> Đăng xuất
                            </a>
                        </div>
                    </div>
                </div>

            {% else %}

                <!-- LOGIN / REGISTER -->
                <a href="{{ url_for('auth.login_page') }}" class="auth-link">🔐 Đăng nhập</a>
                <a href="{{ url_for('auth.register_page') }}" class="auth-link">📝 Đăng ký</a>

            {% endif %}

        </div>

    </div>
</header>
