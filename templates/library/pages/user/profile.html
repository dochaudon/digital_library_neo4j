{% extends 'library/layouts/base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/user/profile.css') }}">
{% endblock %}


{% block content %}
<div class="profile-container">
    
    <!-- LEFT SIDE -->
    <aside class="user-card">
        <div class="avatar-wrapper">
            <i class="fas fa-user-circle"></i>
        </div>
        <h2>{{ user.username }}</h2>
        <p>{{ user.email }}</p>
        <span class="badge badge-{{ user.role.lower() }}">
            {{ user.role }}
        </span>
    </aside>

    <!-- RIGHT SIDE -->
    <main class="profile-content">
        
        <!-- INFO SECTION -->
        <section class="content-section">
            <h3><i class="fas fa-id-card"></i> Thông tin tài khoản</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" value="{{ user.username }}" readonly>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="text" value="{{ user.email }}" readonly>
                </div>
                <div class="form-group">
                    <label>ID Người dùng</label>
                    <input type="text" value="{{ user.id }}" readonly>
                </div>
                <div class="form-group">
                    <label>Trạng thái</label>
                    <input type="text" value="{{ user.status }}" readonly>
                </div>
            </div>
        </section>

        <!-- PASSWORD SECTION -->
        <section class="content-section">
            <h3><i class="fas fa-lock"></i> Đổi mật khẩu</h3>
            <form id="change-password-form">
                <div class="form-group">
                    <label>Mật khẩu hiện tại</label>
                    <div class="password-wrapper">
                        <input type="password" id="old_password" required placeholder="••••••••">
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Mật khẩu mới</label>
                        <div class="password-wrapper">
                            <input type="password" id="new_password" required placeholder="••••••••">
                            <i class="fas fa-eye toggle-password"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Xác nhận mật khẩu mới</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirm_password" required placeholder="••••••••">
                            <i class="fas fa-eye toggle-password"></i>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-key"></i> Cập nhật mật khẩu
                </button>
            </form>
        </section>

    </main>
</div>

<div id="toast" class="toast"></div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/library/pages/profile.js') }}"></script>
{% endblock %}
