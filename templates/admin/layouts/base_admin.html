<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/layouts/base_admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/components/pagination.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    {% block extra_css %}{% endblock %}
    {% block extra_js %}{% endblock %}
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

    {% include 'admin/partials/header.html' %}

    <div class="admin-container">
        <!-- Overlay for mobile sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        {% include 'admin/partials/sidebar.html' %}

        <main class="admin-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% include 'admin/partials/footer.html' %}

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/admin/layouts/base_admin.js') }}"></script>

</body>
</html>
