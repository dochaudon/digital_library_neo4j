{% extends 'admin/layouts/base_admin.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/pages/metadata.css') }}">
{% endblock %}

{% block content %}
<div class="form-container">
    <h2>📂 Thêm Thể Loại Mới</h2>
    
    <form action="/admin/categories/create" method="POST" class="metadata-form">
        <div class="form-group">
            <label>ID Thể loại (Tự động)</label>
            <input type="text" name="id" value="{{ next_id }}" readonly class="readonly">
        </div>
        <div class="form-group">
            <label>Tên thể loại</label>
            <input type="text" name="name" required placeholder="Nhập tên thể loại...">
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn-save">Lưu lại</button>
            <a href="/admin/categories" class="btn-cancel">Hủy bỏ</a>
        </div>
    </form>
</div>
{% endblock %}
