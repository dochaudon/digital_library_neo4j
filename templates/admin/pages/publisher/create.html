{% extends 'admin/layouts/base_admin.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/pages/institution/form.css') }}">
{% endblock %}

{% block content %}
<section class="form-container">

    <div class="form-header">
        <a href="/admin/publishers" class="btn-back"><i class="fas fa-arrow-left"></i> Quay lại</a>
        <h2>🏢 Thêm Nhà Xuất Bản Mới</h2>
    </div>

    <div class="form-card">
        <form action="/admin/publishers/create" method="POST">

            <!-- ID (Tự động) -->
            <div class="form-group">
                <label>Mã Nhà Xuất Bản</label>
                <input type="text" name="id" value="{{ next_id }}" readonly class="readonly-input">
                <small>ID được hệ thống tạo tự động</small>
            </div>

            <!-- NAME -->
            <div class="form-group">
                <label>Tên nhà xuất bản <span class="required">*</span></label>
                <input type="text" name="name" placeholder="VD: NXB Trẻ..." required>
            </div>

            <div class="form-group">
                <label>Địa chỉ</label>
                <input type="text" name="address" placeholder="VD: 161B Lý Chính Thắng, Quận 3, TP.HCM...">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="VD: hopthubandoc@nxbtre.com.vn...">
            </div>

            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" name="phone" placeholder="VD: 028 3931 6289...">
            </div>

            <div class="form-group">
                <label>Website</label>
                <input type="url" name="website" placeholder="VD: https://www.nxbtre.com.vn...">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Lưu</button>
            </div>

        </form>
    </div>

</section>
{% endblock %}
