{% extends 'admin/layouts/base_admin.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/pages/metadata.css') }}">
{% endblock %}

{% block content %}
<div class="form-container">
    <h2>👤 Chỉnh Sửa Tác Giả</h2>
    
    <form action="/admin/authors/edit/{{ author.id }}" method="POST" class="metadata-form">
        <div class="form-group">
            <label>ID Tác giả</label>
            <input type="text" name="id" value="{{ author.id }}" readonly class="readonly">
        </div>
        <div class="form-group">
            <label>Tên tác giả</label>
            <input type="text" name="name" value="{{ author.name }}" required placeholder="Nhập tên tác giả...">
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn-save">Cập nhật</button>
            <a href="/admin/authors" class="btn-cancel">Hủy bỏ</a>
        </div>
    </form>
</div>
{% endblock %}
