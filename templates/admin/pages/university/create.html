{% extends 'admin/layouts/base_admin.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/pages/institution/form.css') }}">
{% endblock %}

{% block content %}
<section class="form-container">

    <div class="form-header">
        <a href="/admin/universities" class="btn-back"><i class="fas fa-arrow-left"></i> Quay lại</a>
        <h2>🎓 Thêm Trường Đại Học Mới</h2>
    </div>

    <div class="form-card">
        <form action="/admin/universities/create" method="POST">

            <!-- ID (Tự động) -->
            <div class="form-group">
                <label>Mã Trường Đại Học</label>
                <input type="text" name="id" value="{{ next_id }}" readonly class="readonly-input">
                <small>ID được hệ thống tạo tự động</small>
            </div>

            <!-- NAME -->
            <div class="form-group">
                <label>Tên trường đại học <span class="required">*</span></label>
                <input type="text" name="name" placeholder="VD: Đại học Bách Khoa..." required>
            </div>

            <div class="form-group">
                <label>Địa chỉ</label>
                <input type="text" name="address" placeholder="VD: Số 1 Đại Cồ Việt, Hà Nội...">
            </div>

            <div class="form-group">
                <label>Email liên hệ</label>
                <input type="email" name="email" placeholder="VD: contact@hust.edu.vn...">
            </div>

            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" name="phone" placeholder="VD: 024 3869 2222...">
            </div>

            <div class="form-group">
                <label>Website</label>
                <input type="url" name="website" placeholder="VD: https://hust.edu.vn...">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Lưu</button>
            </div>

        </form>
    </div>

</section>
{% endblock %}
