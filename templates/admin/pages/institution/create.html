{% extends 'admin/layouts/base_admin.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/pages/metadata.css') }}">
{% endblock %}

{% block content %}
<div class="form-container">
    <h2>🏢 Thêm Cơ Quan / Trường Học Mới</h2>
    
    <form action="/admin/institutions/create" method="POST" class="metadata-form">
        <div class="form-group">
            <label>ID Cơ quan (Tự động)</label>
            <input type="text" name="id" value="{{ next_id }}" readonly class="readonly">
        </div>
        <div class="form-group">
            <label>Tên cơ quan / Trường học</label>
            <input type="text" name="name" required placeholder="Nhập tên cơ quan...">
        </div>
        <div class="form-group">
            <label>Loại tổ chức</label>
            <select name="type">
                <option value="publisher">Nhà xuất bản (Publisher)</option>
                <option value="university">Trường đại học (University)</option>
                <option value="research_center">Viện nghiên cứu (Research Center)</option>
                <option value="other">Khác</option>
            </select>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn-save">Lưu lại</button>
            <a href="/admin/institutions" class="btn-cancel">Hủy bỏ</a>
        </div>
    </form>
</div>
{% endblock %}
